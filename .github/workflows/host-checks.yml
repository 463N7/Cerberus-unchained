name: Check Unchained host fixtures

on:
  push:
    paths:
      - 's3_main/**'
      - 'c5_firmware/**'
      - 'shared/**'
      - 'expansion/**'
      - 'tools/**'
      - 'sdcard/**'
      - '.github/workflows/host-checks.yml'
  pull_request:
    paths:
      - 's3_main/**'
      - 'c5_firmware/**'
      - 'shared/**'
      - 'expansion/**'
      - 'tools/**'
      - 'sdcard/**'
      - '.github/workflows/host-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned host compiler
        run: python -m pip install ziglang==0.14.1
      - name: Run 115 rev94 host suites
        run: python tools/run_host_checks.py --jobs 2
      - name: Check build-report failure handling
        run: python tools/check_build_unified.py
      - name: Check SD resources
        run: python tools/check_field_kit.py
      - name: Save host-check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cerberus-unchained-host-checks-${{ matrix.os }}-${{ github.run_number }}
          path: |
            artifacts/host-checks/host-checks.json
            artifacts/host-checks/*.log
          if-no-files-found: ignore
          retention-days: 14
